name: Release Lexleaf for Windows

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type PUBLISH LEXLEAF followed by the package version'
        required: true
        type: string
      source_sha:
        description: 'Exact verified commit SHA to release'
        required: true
        type: string
      license_compliance_confirmation:
        description: 'Type REVIEWED OEWN AND PRINCETON LICENSES'
        required: true
        type: string
      dry_run:
        description: 'Prepare and verify without creating a tag or release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: Build and publish approved Windows release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: lexleaf-public-release
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify release eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedConfirmation = "PUBLISH LEXLEAF $version"
          if ('${{ inputs.release_confirmation }}' -cne $expectedConfirmation) {
            throw "Release confirmation does not match $expectedConfirmation"
          }
          if ('${{ inputs.license_compliance_confirmation }}' -cne 'REVIEWED OEWN AND PRINCETON LICENSES') {
            throw 'License-compliance confirmation is missing or incorrect.'
          }
          if ('${{ github.ref }}' -cne 'refs/heads/main') {
            throw 'Releases may only run from main.'
          }
          if ('${{ inputs.source_sha }}' -notmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a full 40-character commit SHA.'
          }
          $tag = "v$version"
          $tagError = Join-Path $env:RUNNER_TEMP 'tag-lookup-error.txt'
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" 2> $tagError
          if ($LASTEXITCODE -ne 0) {
            $tagErrorText = Get-Content $tagError -Raw -ErrorAction SilentlyContinue
            if ($tagErrorText -notmatch '(?i)404|not found') {
              throw "Unable to determine whether tag $tag exists: $tagErrorText"
            }
            $existing = $null
          }
          if ($null -ne $existing -and $existing.Length -gt 0) { throw "Tag $tag already exists." }
          $runsError = Join-Path $env:RUNNER_TEMP 'verification-lookup-error.txt'
          $runsJson = gh api "repos/${{ github.repository }}/actions/workflows/windows-release-verify.yml/runs?head_sha=$env:SOURCE_SHA&status=completed&per_page=20" 2> $runsError
          if ($LASTEXITCODE -ne 0) {
            $runsErrorText = Get-Content $runsError -Raw -ErrorAction SilentlyContinue
            throw "Unable to retrieve Windows verification runs from GitHub API: $runsErrorText"
          }
          $runs = $runsJson | ConvertFrom-Json
          $verified = @($runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' -and $_.head_sha -eq $env:SOURCE_SHA })
          if ($verified.Count -eq 0) { throw 'No successful Windows verification run exists for source_sha.' }
          "LEXLEAF_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LEXLEAF_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare and verify production dictionary
        run: |
          npm run dictionary:prepare:production
          npm run dictionary:verify:production
          npm run verify:license-compliance

      - name: Static validation
        shell: pwsh
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          node scripts/check-format-changed.mjs $env:SOURCE_SHA HEAD
          git diff --check

      - name: Validate workflows with pinned actionlint
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          Invoke-WebRequest -Uri 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $archive
          $expected = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'actionlint checksum mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'actionlint') -Force
          $files = @(Get-ChildItem -LiteralPath '.github/workflows' -File | Where-Object { $_.Extension -in @('.yml', '.yaml') } | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw 'No workflow files found.' }
          & (Join-Path $env:RUNNER_TEMP 'actionlint/actionlint.exe') -color @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit and integration tests
        run: |
          npm test
          npm run test:integration

      - name: Build application and Windows installer
        run: |
          npm run build
          npx electron-builder --win dir --x64 --config electron-builder.yml --publish never
          node scripts/packaging/verify-packaged-output.mjs dist/win-unpacked
          npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Lexleaf-$env:LEXLEAF_VERSION-x64-setup.exe"
          $dist = (Resolve-Path dist).Path
          $published = Join-Path $dist $expectedName
          if (-not (Test-Path -LiteralPath $published -PathType Leaf)) { throw "Expected installer missing: $expectedName" }
          if ((Get-Item -LiteralPath $published).Length -le 0) { throw 'Installer is empty.' }
          $hash = (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $dist 'SHA256SUMS.txt'
          "$hash  $expectedName" | Out-File -LiteralPath $checksumPath -Encoding ascii
          # What an installed copy reads to update itself: the release
          # metadata must name this installer and this version, and the
          # packaged application must carry the address it asks.
          $updateInfoPath = Join-Path $dist 'latest.yml'
          $blockmapPath = "$published.blockmap"
          foreach ($required in @($updateInfoPath, $blockmapPath, (Join-Path $dist 'win-unpacked/resources/app-update.yml'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Update file missing: $required" }
          }
          # An unedited executable still carries Electron's name and icon.
          $appInfo = (Get-Item -LiteralPath (Join-Path $dist 'win-unpacked/Lexleaf.exe')).VersionInfo
          if ($appInfo.ProductName -cne 'Lexleaf') { throw "Lexleaf.exe is branded '$($appInfo.ProductName)', not Lexleaf: the icon and name were not applied." }
          if ($appInfo.ProductVersion -notlike "$env:LEXLEAF_VERSION*") { throw "Lexleaf.exe reports version '$($appInfo.ProductVersion)'." }
          $updateInfo = Get-Content -LiteralPath $updateInfoPath -Raw
          if (-not $updateInfo.Contains("version: $env:LEXLEAF_VERSION")) { throw 'latest.yml does not name this version.' }
          if (-not $updateInfo.Contains($expectedName)) { throw 'latest.yml does not name this installer.' }
          "INSTALLER_PATH=$published" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_INFO_PATH=$updateInfoPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BLOCKMAP_PATH=$blockmapPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Dry-run release eligibility
        if: inputs.dry_run
        run: echo 'Dry run passed; no tag or GitHub Release will be created.'

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($name in @('LEXLEAF_VERSION', 'LEXLEAF_TAG', 'INSTALLER_PATH', 'CHECKSUM_PATH', 'UPDATE_INFO_PATH', 'BLOCKMAP_PATH')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "$name is empty." }
          }
          if (-not (Test-Path -LiteralPath $env:INSTALLER_PATH -PathType Leaf)) { throw 'Installer path does not exist.' }
          $notes = @"
          Lexleaf $env:LEXLEAF_VERSION for Windows x64.

          Lexleaf is an offline-first PDF reader with local dictionary lookup.
          Install the Windows x64 installer and verify SHA256SUMS.txt before running it.

          The installer is unsigned; Windows SmartScreen may display a warning.
          The bundled Open English WordNet dictionary is distributed with its separate attribution and license notices.
          "@
          gh release create $env:LEXLEAF_TAG $env:INSTALLER_PATH $env:CHECKSUM_PATH $env:UPDATE_INFO_PATH $env:BLOCKMAP_PATH --title "Lexleaf $env:LEXLEAF_VERSION" --notes $notes
