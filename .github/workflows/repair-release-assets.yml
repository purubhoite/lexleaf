name: Repair Lexleaf release assets

on:
  workflow_dispatch:
    inputs:
      release_source_sha:
        description: Original release source commit SHA referenced by v0.2.7
        required: true
        type: string
      release_confirmation:
        description: Type REPAIR LEXLEAF 0.2.7
        required: true
        type: string
      license_compliance_confirmation:
        description: Type REVIEWED OEWN AND PRINCETON LICENSES
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: lexleaf-public-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
      EXPECTED_VERSION: '0.2.7'
      EXPECTED_TAG: 'v0.2.7'
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Check out original release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_source_sha }}
          path: release-source
          fetch-depth: 0

      - name: Validate release and source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'release_source_sha must be a full SHA.' }
          if ((git -C release-source rev-parse HEAD) -cne $env:RELEASE_SOURCE_SHA) { throw 'Release source checkout does not match expected SHA.' }
          $tag = gh api "repos/${{ github.repository }}/git/ref/tags/$env:EXPECTED_TAG" 2> "$env:RUNNER_TEMP\tag-error.txt"
          if ($LASTEXITCODE -ne 0) { throw "Tag lookup failed: $(Get-Content "$env:RUNNER_TEMP\tag-error.txt" -Raw)" }
          $tagObject = $tag | ConvertFrom-Json
          $tagCommit = gh api "repos/${{ github.repository }}/git/commits/$($tagObject.object.sha)" 2> "$env:RUNNER_TEMP\commit-error.txt"
          if ($LASTEXITCODE -ne 0) { throw "Tag commit lookup failed: $(Get-Content "$env:RUNNER_TEMP\commit-error.txt" -Raw)" }
          if (($tagCommit | ConvertFrom-Json).sha -cne $env:RELEASE_SOURCE_SHA) { throw 'Existing tag does not point to release source.' }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:EXPECTED_TAG" 2> "$env:RUNNER_TEMP\release-error.txt"
          if ($LASTEXITCODE -ne 0) { throw "Release lookup failed: $(Get-Content "$env:RUNNER_TEMP\release-error.txt" -Raw)" }
          if (($release | ConvertFrom-Json).tag_name -cne $env:EXPECTED_TAG) { throw 'Existing release tag mismatch.' }
          $package = Get-Content release-source/package.json -Raw | ConvertFrom-Json
          if ([string]$package.version -cne $env:EXPECTED_VERSION) { throw 'package.json version mismatch.' }
          if ('${{ inputs.release_confirmation }}' -cne 'REPAIR LEXLEAF 0.2.7') { throw 'Repair confirmation mismatch.' }
          if ('${{ inputs.license_compliance_confirmation }}' -cne 'REVIEWED OEWN AND PRINCETON LICENSES') { throw 'License confirmation mismatch.' }
          "LEXLEAF_VERSION=$([string]$package.version)" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install locked dependencies
        working-directory: release-source
        run: npm ci

      - name: Prepare and verify production dictionary
        working-directory: release-source
        run: |
          npm run dictionary:prepare:production
          npm run dictionary:verify:production
          npm run verify:license-compliance

      - name: Build application bundles
        working-directory: release-source
        run: npm run build

      - name: Confirm Electron main bundle
        working-directory: release-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'out/main/index.js' -PathType Leaf)) { throw 'Electron main bundle out/main/index.js is missing.' }
          Get-ChildItem out -Recurse

      - name: Build Windows NSIS installer
        working-directory: release-source
        run: npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Verify installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Lexleaf-$env:LEXLEAF_VERSION-x64-setup.exe"
          $installerPath = Join-Path (Resolve-Path release-source/dist) $expectedName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) { throw "Expected installer missing: $expectedName" }
          $installer = Get-Item -LiteralPath $installerPath
          if ($installer.Length -le 0) { throw 'Installer is empty.' }
          $checksumPath = Join-Path $installer.DirectoryName 'SHA256SUMS.txt'
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $expectedName" | Out-File -LiteralPath $checksumPath -Encoding ascii
          if ((Get-Content $checksumPath -Raw).Trim() -cne "$hash  $expectedName") { throw 'Checksum file verification failed.' }
          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # A rebuilt installer has a new hash. The update metadata built with
          # it must replace the published one, or installed copies would
          # refuse the download.
          $updateInfoPath = Join-Path $installer.DirectoryName 'latest.yml'
          $blockmapPath = "$installerPath.blockmap"
          foreach ($required in @($updateInfoPath, $blockmapPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Update file missing: $required" }
          }
          if (-not (Get-Content -LiteralPath $updateInfoPath -Raw).Contains($expectedName)) { throw 'latest.yml does not name this installer.' }
          "UPDATE_INFO_PATH=$updateInfoPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BLOCKMAP_PATH=$blockmapPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload assets to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER_PATH)) { throw 'INSTALLER_PATH is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:CHECKSUM_PATH)) { throw 'CHECKSUM_PATH is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_INFO_PATH)) { throw 'UPDATE_INFO_PATH is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:BLOCKMAP_PATH)) { throw 'BLOCKMAP_PATH is empty.' }
          if (-not (Test-Path -LiteralPath $env:INSTALLER_PATH -PathType Leaf)) { throw "Installer path does not exist: $env:INSTALLER_PATH" }
          if (-not (Test-Path -LiteralPath $env:CHECKSUM_PATH -PathType Leaf)) { throw "Checksum path does not exist: $env:CHECKSUM_PATH" }
          Write-Host "Resolved installer: $env:INSTALLER_PATH"
          Write-Host "Resolved checksum: $env:CHECKSUM_PATH"
          $releaseUploadArgs = @(
            'release'
            'upload'
            $env:EXPECTED_TAG
            $env:INSTALLER_PATH
            $env:CHECKSUM_PATH
            $env:UPDATE_INFO_PATH
            $env:BLOCKMAP_PATH
            '--repo'
            '${{ github.repository }}'
            '--clobber'
          )
          Write-Host "Uploading $($releaseUploadArgs.Count) release arguments."
          for ($i = 0; $i -lt $releaseUploadArgs.Count; $i++) { Write-Host "arg[$i]=$($releaseUploadArgs[$i])" }
          & gh @releaseUploadArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release asset upload failed with exit code $LASTEXITCODE." }
