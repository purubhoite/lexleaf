name: Linux release verification and publication

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Original release source commit SHA
        required: true
        type: string
      release_confirmation:
        description: Type PUBLISH LEXLEAF LINUX 0.2.0
        required: true
        type: string
      license_compliance_confirmation:
        description: Type REVIEWED OEWN AND PRINCETON LICENSES
        required: true
        type: string
      publish:
        description: Upload verified assets to existing v0.2.0 release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lexleaf-public-release
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_VERSION: '0.2.0'
      EXPECTED_TAG: 'v0.2.0'
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          path: workflow-source
          fetch-depth: 1

      - name: Check out original release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          fetch-depth: 0

      - name: Validate tag, release, source, and confirmations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full SHA' >&2; exit 1; }
          [[ "$(git -C release-source rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'source checkout mismatch' >&2; exit 1; }
          tag_json=$(gh api "repos/${{ github.repository }}/git/ref/tags/$EXPECTED_TAG")
          tag_sha=$(jq -r '.object.sha' <<<"$tag_json")
          tag_type=$(jq -r '.object.type' <<<"$tag_json")
          [[ "$tag_type" == commit && "$tag_sha" == "$SOURCE_SHA" ]] || { echo 'existing tag target mismatch' >&2; exit 1; }
          release_json=$(gh api "repos/${{ github.repository }}/releases/tags/$EXPECTED_TAG")
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$EXPECTED_TAG" ]] || { echo 'existing release mismatch' >&2; exit 1; }
          version=$(jq -r '.version' release-source/package.json)
          [[ "$version" == "$EXPECTED_VERSION" ]] || { echo 'package version mismatch' >&2; exit 1; }
          [[ '${{ inputs.release_confirmation }}' == 'PUBLISH LEXLEAF LINUX 0.2.0' ]] || { echo 'release confirmation mismatch' >&2; exit 1; }
          [[ '${{ inputs.license_compliance_confirmation }}' == 'REVIEWED OEWN AND PRINCETON LICENSES' ]] || { echo 'license confirmation mismatch' >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Prepare dictionary and run checks
        working-directory: release-source
        run: |
          npm run dictionary:prepare:production
          npm run dictionary:verify:production
          npm run verify:license-compliance
          npm run typecheck
          npm run lint
          npm run build

      - name: Package AppImage and Debian package
        working-directory: release-source
        run: |
          set -euo pipefail
          config_path="$GITHUB_WORKSPACE/workflow-source/linux-builder.yml"
          test -f "$config_path" || { echo "Linux builder configuration not found: $config_path" >&2; exit 1; }
          echo "Using Linux builder configuration: $config_path"
          npx electron-builder --linux AppImage deb --x64 --config "$config_path" --publish never

      - name: Verify Linux packages and checksum
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appimage="dist/Lexleaf-${EXPECTED_VERSION}-x86_64.AppImage"
          deb="dist/Lexleaf-${EXPECTED_VERSION}-amd64.deb"
          test -s "$appimage"
          test -s "$deb"
          file "$appimage" "$deb"
          ar t "$deb" | grep -q '^debian-binary$'
          dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards '*etc/apport/report-ignore/lexleaf' | grep -Fx '/opt/Lexleaf/lexleaf'
          dpkg-deb --fsys-tarfile "$deb" | tar -t | grep -Ex '(\./)?opt/Lexleaf/lexleaf'
          sha256sum "$appimage" "$deb" > dist/linux-SHA256SUMS.txt
          grep -F "Lexleaf-${EXPECTED_VERSION}-x86_64.AppImage" dist/linux-SHA256SUMS.txt
          grep -F "Lexleaf-${EXPECTED_VERSION}-amd64.deb" dist/linux-SHA256SUMS.txt
          : > dist/SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/lexleaf-release-checksum"
          gh release download "$EXPECTED_TAG" --repo '${{ github.repository }}' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/lexleaf-release-checksum"
          grep -F "Lexleaf-${EXPECTED_VERSION}-x64-setup.exe" "$RUNNER_TEMP/lexleaf-release-checksum/SHA256SUMS.txt" >> dist/SHA256SUMS.txt || { echo 'Existing Windows checksum is missing' >&2; exit 1; }
          cat dist/linux-SHA256SUMS.txt >> dist/SHA256SUMS.txt
          test "$(grep -c '[^[:space:]]' dist/SHA256SUMS.txt)" -eq 3
          # What an installed AppImage reads to update itself. Releases cut
          # before the update feature have none of these files.
          if [[ -f dist/latest-linux.yml ]]; then
            grep -F "version: ${EXPECTED_VERSION}" dist/latest-linux.yml
            grep -F "Lexleaf-${EXPECTED_VERSION}-x86_64.AppImage" dist/latest-linux.yml
            test -s dist/linux-unpacked/resources/app-update.yml
          fi

      - name: Smoke test packaged application under Xvfb
        working-directory: release-source
        run: |
          set -euo pipefail
          timeout 20s xvfb-run -a ./dist/linux-unpacked/lexleaf --no-sandbox --disable-gpu >/tmp/lexleaf-linux.log 2>&1 || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 124 ]]; then cat /tmp/lexleaf-linux.log; exit "$status"; fi
          test -s /tmp/lexleaf-linux.log || true

      - name: Upload assets to existing release
        if: inputs.publish
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_args=(release upload "$EXPECTED_TAG" "dist/Lexleaf-${EXPECTED_VERSION}-x86_64.AppImage" "dist/Lexleaf-${EXPECTED_VERSION}-amd64.deb" dist/SHA256SUMS.txt --repo '${{ github.repository }}')
          upload_args=(release upload "$EXPECTED_TAG" "dist/Lexleaf-${EXPECTED_VERSION}-x86_64.AppImage" "dist/Lexleaf-${EXPECTED_VERSION}-amd64.deb" --repo '${{ github.repository }}')
          gh "${upload_args[@]}"
          checksum_args=(release upload "$EXPECTED_TAG" dist/SHA256SUMS.txt --repo '${{ github.repository }}' --clobber)
          gh "${checksum_args[@]}"
          if [[ -f dist/latest-linux.yml ]]; then
            update_info_args=(release upload "$EXPECTED_TAG" dist/latest-linux.yml --repo '${{ github.repository }}' --clobber)
            gh "${update_info_args[@]}"
          fi
