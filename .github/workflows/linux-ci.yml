name: Linux build verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: |
          npm run dictionary:prepare:production
          npm run dictionary:verify:production
          npm run verify:license-compliance
          npm run typecheck
          npm run lint
          npm test
          npm run test:integration
          npm run build
      - run: npx electron-builder --linux AppImage deb --x64 --config linux-builder.yml --publish never
      - name: Verify packages and run smoke test
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          appimage="dist/Lexleaf-${version}-x86_64.AppImage"
          deb="dist/Lexleaf-${version}-amd64.deb"
          test -s "$appimage"
          test -s "$deb"
          ar t "$deb" | grep -q '^debian-binary$'
          sha256sum "$appimage" "$deb" > dist/SHA256SUMS.txt
          # The crash-reporter exclusion must be installed, and must name the
          # executable the package really installs.
          dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards '*etc/apport/report-ignore/lexleaf' | grep -Fx '/opt/Lexleaf/lexleaf'
          dpkg-deb --fsys-tarfile "$deb" | tar -t | grep -Ex '(\./)?opt/Lexleaf/lexleaf'
          # The files an installed copy needs to update itself.
          grep -F "version: ${version}" dist/latest-linux.yml
          grep -F "Lexleaf-${version}-x86_64.AppImage" dist/latest-linux.yml
          grep -F 'provider: github' dist/linux-unpacked/resources/app-update.yml
          grep -F 'repo: lexleaf' dist/linux-unpacked/resources/app-update.yml
          timeout 20s xvfb-run -a ./dist/linux-unpacked/lexleaf --no-sandbox --disable-gpu >/tmp/lexleaf-linux.log 2>&1 || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 124 ]]; then cat /tmp/lexleaf-linux.log; exit "$status"; fi
