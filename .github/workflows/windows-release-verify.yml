name: Windows release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.1
          cache: npm

      - name: Fetch verification base for scoped checks
        shell: pwsh
        run: git fetch --no-tags origin release/windows-verification --depth=1

      - name: Install dependencies
        run: npm ci

      - name: Prepare and verify production dictionary
        run: npm run dictionary:prepare:production

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check for changed public files
        shell: pwsh
        run: |
          # Workflow YAML is checked by actionlint below. Keep all other
          # supported public text/configuration files in the Prettier gate.
          $files = git diff --name-only FETCH_HEAD HEAD |
            Where-Object {
              $_ -match '\.(c?js|mjs|json|md|ts|tsx|yaml|yml)$' -and
              $_ -notmatch '^\.github/workflows/.*\.ya?ml$'
            }
          if (-not $files) { throw 'no supported changed files found for format check' }
          foreach ($file in $files) {
            npx prettier --check --end-of-line lf --ignore-unknown -- $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install pinned actionlint
        shell: pwsh
        run: |
          $version = '1.7.12'
          $archive = Join-Path $env:RUNNER_TEMP "actionlint_$version.zip"
          $url = "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "actionlint archive checksum mismatch: $actual" }
          $bin = Join-Path $env:RUNNER_TEMP 'actionlint'
          Expand-Archive -Path $archive -DestinationPath $bin -Force
          "ACTIONLINT_BIN=$bin\actionlint.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Validate GitHub Actions workflows
        shell: pwsh
        run: |
          & $env:ACTIONLINT_BIN -color .github/workflows/*.yml .github/workflows/*.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify workflow safety invariants
        shell: pwsh
        run: |
          git diff --check
          $workflow = Get-Content .github/workflows/windows-release-verify.yml -Raw
          if ($workflow -notmatch '(?m)^\s*workflow_dispatch:\s*$') { throw 'workflow_dispatch missing' }
          if ($workflow -notmatch '(?m)^\s*contents:\s*read\s*$') { throw 'read-only contents permission missing' }
          if ($workflow -match 'actions/upload-artifact|gh release|git tag') { throw 'publishing operation detected' }

      - name: Unit tests
        run: npm test

      - name: Focused dictionary and packaging tests
        run: npm test -- --run src/main/dictionary src/renderer/src/reader/dictionary tests/integration/dictionaryArtifact.test.ts

      - name: Integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Build unpacked Windows application
        run: npx electron-builder --win dir --x64 --config electron-builder.yml

      - name: Verify packaged dictionary
        run: node scripts/packaging/verify-packaged-output.mjs dist/win-unpacked

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --config electron-builder.yml

      - name: Inspect installer and install silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'installer missing' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$($installer.FullName) size=$($installer.Length) sha256=$hash" | Tee-Object -FilePath dist\installer-integrity.txt
          $install = Join-Path $env:RUNNER_TEMP 'lexleaf-install'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$install" -Wait -NoNewWindow
          if (-not (Test-Path $install)) { throw 'install directory missing' }
          $installed = Get-ChildItem $install -Recurse -Directory | Where-Object { $_.Name -eq 'dictionary' } | Select-Object -First 1
          if (-not $installed) { throw 'installed dictionary directory missing' }
          node scripts/packaging/verify-packaged-output.mjs $install
          Write-Output "Installed dictionary verification completed at $install\resources\dictionary"

      # Installer and dictionary artifacts intentionally remain on the ephemeral runner.
      # After legal approval, add a separately reviewed upload step with explicit
      # retention and scope controls; do not upload dictionary-containing artifacts before then.
