appId: io.github.purubhoite.lexleaf
productName: Lexleaf
artifactName: Lexleaf-${version}-${arch}.${ext}
# Where an installed copy looks for a newer release when the reader asks
# it to update itself. The build writes this into the application
# (resources/app-update.yml) and produces the release metadata that names
# the installer and its SHA-512. Nothing is uploaded by the build: the
# release workflows run it with --publish never and upload the files.
publish:
  provider: github
  owner: purubhoite
  repo: lexleaf
  releaseType: release
asar: true
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/dictionary
    to: dictionary
    filter:
      - '**/*'
# Lets a reader open a PDF from the file manager: Lexleaf is offered under
# "Open with" for .pdf files. The path arrives as a command-line argument
# (src/main/documents/initialDocument.ts).
fileAssociations:
  - ext: pdf
    name: PDF document
    description: PDF document
    mimeType: application/pdf
    role: Viewer
  - ext: epub
    name: EPUB book
    description: EPUB book
    mimeType: application/epub+zip
    role: Viewer
win:
  icon: resources/icons/lexleaf.ico
  target:
    - target: nsis
      arch:
        - x64
  # No certificate is configured, so nothing is signed. The executable is
  # still edited: that is what gives Lexleaf.exe (and so the shortcuts, the
  # taskbar and the window) the Lexleaf icon and name instead of Electron's.
  signExecutable: false
nsis:
  # The identity Windows knows an installation by. It was derived from the
  # original application id (com.intelligentpdfreader.poc) and is pinned
  # here so that renaming the id did not turn every upgrade into a second,
  # separate installation. Do not change it.
  guid: 0d4ad4f5-4282-5079-9f15-20bd97f482fb
  installerIcon: resources/icons/lexleaf.ico
  uninstallerIcon: resources/icons/lexleaf.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: Lexleaf-${version}-${arch}-setup.${ext}
