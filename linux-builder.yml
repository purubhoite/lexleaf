appId: com.intelligentpdfreader.poc
productName: Lexleaf
executableName: lexleaf
extraMetadata:
  homepage: https://github.com/purubhoite/lexleaf
  author:
    name: Lexleaf
    email: 216851203+purubhoite@users.noreply.github.com
artifactName: Lexleaf-${version}-${arch}.${ext}
# Where an installed copy looks for a newer release when the reader asks
# it to update itself. The build writes this into the application
# (resources/app-update.yml) and produces the release metadata that names
# the installer and its SHA-512. Nothing is uploaded by the build: the
# release workflows run it with --publish never and upload the files.
publish:
  provider: github
  owner: purubhoite
  repo: lexleaf
  releaseType: release
asar: true
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/dictionary
    to: dictionary
    filter:
      - '**/*'
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Lexleaf <216851203+purubhoite@users.noreply.github.com>
  syncDesktopName: true
  synopsis: Read PDFs and build vocabulary
  description: A local-first desktop PDF reader with offline dictionary lookup.
  icon: resources/icons/lexleaf-logo.png
  artifactName: Lexleaf-${version}-${arch}.${ext}
deb:
  # Tells Ubuntu's crash reporter to leave Lexleaf alone. Its "relaunch"
  # restarts a crashed helper process on its own, which then fills the
  # system log; see resources/linux/apport-report-ignore.
  fpm:
    - resources/linux/apport-report-ignore=/etc/apport/report-ignore/lexleaf
